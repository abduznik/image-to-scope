name: Release

# Publishes Windows, Linux and macOS builds whenever main carries a version
# (backend.__version__) that has no GitHub release yet. To ship a new version:
# bump __version__ in backend.py and merge to main.
#
# Run it by hand from the Actions tab with "replace" ticked to rebuild and
# overwrite an existing release of the current version, or push to main with
# "[replace-release]" in the commit message.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replace:
        description: Delete and re-publish the release if this version already exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Shared PyInstaller options. PIL._tkinter_finder is needed for images in Tk
  # and is not picked up automatically.
  PYINSTALLER_ARGS: >-
    --noconfirm --clean --windowed --name ImageToScope
    --hidden-import PIL._tkinter_finder

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
      replace: ${{ steps.version.outputs.replace }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          REPLACE: ${{ inputs.replace || contains(github.event.head_commit.message, '[replace-release]') }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend.py)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read __version__ from backend.py"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            if [ "$REPLACE" = "true" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "replace=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG exists and will be replaced"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "replace=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG is already released - nothing to do. Bump __version__ in backend.py, or run this workflow by hand with 'replace' ticked."
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "replace=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $TAG"
          fi

  test:
    name: Test
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  windows:
    name: Build Windows .exe
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ASSET: ImageToScope-${{ needs.version.outputs.tag }}-windows-x64.exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        shell: bash
        run: >
          pyinstaller $PYINSTALLER_ARGS --onefile
          --icon assets/icon.ico
          --add-data "assets/icon-256.png;assets"
          main.py
      - name: Smoke test (processing + GUI)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ImageToScope.exe -ArgumentList '--self-test','--require-gui' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          Write-Host "Self-test passed"
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp dist/ImageToScope.exe "release/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  linux:
    name: Build Linux AppImage
    needs: [version, test]
    # The oldest supported runner, so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ASSET: ImageToScope-${{ needs.version.outputs.tag }}-linux-x86_64.AppImage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: >
          pyinstaller $PYINSTALLER_ARGS
          --add-data "assets/icon-256.png:assets"
          main.py
      - name: Build AppImage
        run: |
          mkdir -p release
          packaging/linux/build-appimage.sh "release/$ASSET"
      - name: Smoke test (processing + GUI)
        timeout-minutes: 5
        run: APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "release/$ASSET" --self-test --require-gui
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*
          if-no-files-found: error

  macos:
    name: Build macOS .app (${{ matrix.arch }})
    needs: [version, test]
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ASSET: ImageToScope-${{ needs.version.outputs.tag }}-macos-${{ matrix.arch }}.zip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: >
          pyinstaller $PYINSTALLER_ARGS
          --icon assets/icon.icns
          --add-data "assets/icon-256.png:assets"
          --osx-bundle-identifier io.github.abduznik.imagetoscope
          main.py
      - name: Set bundle version
        run: |
          PLIST=dist/ImageToScope.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.version.outputs.version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ needs.version.outputs.version }}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.version.outputs.version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Image to Scope" "$PLIST" || true
          # Editing Info.plist invalidates the ad-hoc signature; re-sign.
          codesign --force --deep --sign - dist/ImageToScope.app
      - name: Smoke test (processing + GUI)
        timeout-minutes: 5
        run: dist/ImageToScope.app/Contents/MacOS/ImageToScope --self-test --require-gui
      - name: Package
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/ImageToScope.app "release/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum ImageToScope-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Remove the existing release
        if: needs.version.outputs.replace == 'true'
        run: gh release delete "$TAG" --cleanup-tag --yes
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Image to Scope ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            **Image to Scope** ${{ env.TAG }} - no install or Python needed.

            | Platform | Download |
            |---|---|
            | Windows 10/11 (64-bit) | `ImageToScope-${{ env.TAG }}-windows-x64.exe` |
            | Linux (x86_64) | `ImageToScope-${{ env.TAG }}-linux-x86_64.AppImage` |
            | macOS, Apple Silicon (M1 and later) | `ImageToScope-${{ env.TAG }}-macos-arm64.zip` |
            | macOS, Intel | `ImageToScope-${{ env.TAG }}-macos-x86_64.zip` |

            The builds are not code-signed yet, so the first launch needs one extra step:

            - **Windows:** if SmartScreen warns, click **More info → Run anyway**.
            - **Linux:** `chmod +x ImageToScope-*.AppImage`, then run it. If it complains about FUSE, install `libfuse2` (or run it with `--appimage-extract-and-run`).
            - **macOS:** unzip and move **ImageToScope.app** to Applications. If macOS says it can't be opened, go to **System Settings → Privacy & Security → Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/ImageToScope.app`.

            `SHA256SUMS.txt` lists the checksum of every download.
