# Tool configuration only - the app is run with `python main.py`
# and shipped as a PyInstaller .exe (see .github/workflows/release.yml).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A hung test fails after 2 minutes and dumps every thread's stack.
timeout = 120
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
