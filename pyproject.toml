# Tool configuration only - the app is run with `python main.py`
# and shipped as a PyInstaller .exe (see .github/workflows/release.yml).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
